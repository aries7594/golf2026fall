<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026 회장배 골프</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #f4f6f9;
        }
        iframe {
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- 아래 src 큰따옴표 안에 1단계에서 복사한 본인의 Apps Script 웹앱 URL을 넣으세요 -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbwxdIdRmq8_pWPf1b_AsnA9Zjo-i7u-xEiBX7lwH_GBo73LMJLZTPoYlxHKnsMd6lrh/exec" 
        allow="autoplay; camera; microphone; geolocation"
        frameborder="0">
    </iframe>
</body>
</html>
