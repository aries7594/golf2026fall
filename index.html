<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 회장배 골프</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #800020;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 세련된 로딩 화면 */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #a3002b 0%, #800020 60%, #4a0013 100%);
      color: #fff;
      z-index: 999;
      transition: opacity 0.3s ease-out;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .load-text {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }

    iframe.loaded {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="spinner"></div>
    <div class="load-text">⛳ 2026 회장배 연결 중...</div>
  </div>

  <!-- 본인의 Apps Script 웹앱 URL을 넣으세요 -->
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwxdIdRmq8_pWPf1b_AsnA9Zjo-i7u-xEiBX7lwH_GBo73LMJLZTPoYlxHKnsMd6lrh/exec"
    allow="geolocation *; autoplay *; camera *; microphone *" onload="onFrameReady()">
  </iframe>

  <script>
    function onFrameReady() {
      var loader = document.getElementById('loader');
      var frame = document.getElementById('appFrame');
      frame.classList.add('loaded');
      loader.style.opacity = '0';
      setTimeout(function () {
        loader.style.display = 'none';
      }, 300);
    }

    // 아이폰(iOS Safari / 카카오톡 인앱 브라우저) 3중 iframe GPS 차단 우회용 최상위 창 GPS 브릿지
    var gpsChildWin = null;
    var gpsParentWatchId = null;
    var gpsLastCoords = null;

    function sendToChild(msg) {
      if (!gpsChildWin) return;
      try {
        gpsChildWin.postMessage(msg, '*');
      } catch (e) {}
    }

    function startParentGpsWatch(forceRetry) {
      if (!navigator.geolocation) {
        sendToChild({ type: 'GOLF_GPS_ERR', code: 2, message: 'Geolocation not supported' });
        return;
      }
      if (gpsParentWatchId !== null && forceRetry) {
        navigator.geolocation.clearWatch(gpsParentWatchId);
        gpsParentWatchId = null;
      }
      if (gpsParentWatchId !== null) {
        if (gpsLastCoords) {
          sendToChild({
            type: 'GOLF_GPS_POS',
            lat: gpsLastCoords.latitude,
            lon: gpsLastCoords.longitude
          });
        }
        return;
      }

      gpsParentWatchId = navigator.geolocation.watchPosition(
        function (pos) {
          gpsLastCoords = pos.coords;
          sendToChild({
            type: 'GOLF_GPS_POS',
            lat: pos.coords.latitude,
            lon: pos.coords.longitude
          });
        },
        function (err) {
          if (err && err.code !== 1) {
            return;
          }
          if (gpsParentWatchId !== null) {
            navigator.geolocation.clearWatch(gpsParentWatchId);
            gpsParentWatchId = null;
          }
          sendToChild({
            type: 'GOLF_GPS_ERR',
            code: 1,
            message: (err && err.message) ? err.message : 'Permission denied'
          });
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
      );
    }

    window.addEventListener('message', function (e) {
      var d = e && e.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'GOLF_GPS_PING') {
        gpsChildWin = e.source;
        sendToChild({ type: 'GOLF_GPS_PONG' });
      } else if (d.type === 'GOLF_GPS_START') {
        gpsChildWin = e.source;
        sendToChild({ type: 'GOLF_GPS_BRIDGE_ACTIVE' });
        startParentGpsWatch(!!d.forceRetry);
      }
    });
  </script>
</body>

</html>
